name: ATORA LMS CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atora-lms-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP ${{ matrix.php }} quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install reproducible test dependencies
        shell: bash
        run: |
          if [[ -f composer.lock ]]; then
            composer install --no-interaction --prefer-dist --no-progress
          else
            composer update --no-interaction --prefer-dist --no-progress
          fi

      - name: Lint PHP files
        shell: bash
        run: |
          find . -path ./vendor -prune -o -name '*.php' -print0 |
            xargs -0 -n1 php -l

      - name: Export generated Composer lock
        if: matrix.php == '8.1' && hashFiles('composer.lock') != ''
        uses: actions/upload-artifact@v4
        with:
          name: composer-lock
          path: composer.lock
          if-no-files-found: error
          retention-days: 7

  unit-tests:
    name: PHPUnit legacy suite (diagnostic)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run complete PHPUnit suite
        run: composer test

      - name: Record diagnostic status
        if: failure()
        run: |
          echo "::warning::The inherited PHPUnit suite has known bootstrap and isolation debt. Blocking syntax and dynamic WordPress smoke checks still run independently."

  wordpress-smoke:
    name: WordPress ${{ matrix.wordpress }} / PHP 8.1
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wordpress:
          - "6.4"
          - "6.8"

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4

      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none
          tools: wp-cli

      - name: Install WordPress
        shell: bash
        run: |
          wp core download --version="${{ matrix.wordpress }}" --skip-content --path=/tmp/wordpress
          wp config create \
            --path=/tmp/wordpress \
            --dbname=wordpress \
            --dbuser=root \
            --dbpass=root \
            --dbhost=127.0.0.1:3306 \
            --skip-check
          wp config set WP_DEBUG true --raw --path=/tmp/wordpress
          wp config set WP_DEBUG_LOG true --raw --path=/tmp/wordpress
          wp core install \
            --path=/tmp/wordpress \
            --url=http://atora.test \
            --title="ATORA CI" \
            --admin_user=admin \
            --admin_password=atora-ci-password \
            --admin_email=ci@example.test \
            --skip-email

      - name: Install and activate ATORA LMS
        shell: bash
        run: |
          mkdir -p /tmp/wordpress/wp-content/plugins/atora-lms
          rsync -a \
            --exclude=.git \
            --exclude=vendor \
            --exclude=dist \
            ./ /tmp/wordpress/wp-content/plugins/atora-lms/
          wp plugin activate atora-lms --path=/tmp/wordpress

      - name: Verify runtime bootstrap
        shell: bash
        run: |
          wp eval '
            if ( ! defined( "ATORA_LMS_VERSION" ) || "6.13.3" !== ATORA_LMS_VERSION ) {
              fwrite( STDERR, "Unexpected ATORA LMS version\n" );
              exit( 1 );
            }
            if ( ! post_type_exists( "lm_course" ) ) {
              fwrite( STDERR, "lm_course was not registered\n" );
              exit( 1 );
            }
          ' --path=/tmp/wordpress
          wp --path=/tmp/wordpress --context=admin eval '
            if ( class_exists( "CLMS_Admin_Menu" ) ) {
              new CLMS_Admin_Menu();
            }
            do_action( "admin_menu" );
            $hook = get_plugin_page_hookname( "atora-onboarding", "clms-dashboard" );
            if ( empty( $GLOBALS["_registered_pages"][ $hook ] ) ) {
              fwrite( STDERR, "ATORA onboarding admin page was not registered with its parent hook\n" );
              exit( 1 );
            }
          '
          wp rewrite structure '/%postname%/' --path=/tmp/wordpress
          wp rewrite flush --hard --path=/tmp/wordpress
          course_id="$(wp post create \
            --post_type=lm_course \
            --post_status=publish \
            --post_title='Curso de humo CI' \
            --porcelain \
            --path=/tmp/wordpress)"
          test -n "$course_id"
          wp post get "$course_id" --field=post_status --path=/tmp/wordpress | grep -qx publish

      - name: Surface WordPress debug log
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/wordpress/wp-content/debug.log ]]; then
            sed -n '1,400p' /tmp/wordpress/wp-content/debug.log
          fi

  distribution:
    name: Distribution package
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build ZIP
        run: ./scripts/build-dist.sh 6.13.3

      - name: Inspect ZIP
        shell: bash
        run: |
          unzip -t dist/atora-lms-6.13.3.zip
          ! unzip -Z1 dist/atora-lms-6.13.3.zip | grep -E '(^|/)(\.git|\.claude|tests|docs|vendor|composer\.(json|lock)|phpunit\.xml)(/|$)'

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: atora-lms-6.13.3
          path: dist/atora-lms-6.13.3.zip
          if-no-files-found: error
          retention-days: 7
